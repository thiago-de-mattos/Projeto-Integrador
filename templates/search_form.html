<form method="get" class="search-bar">
    <input
        type="text"
        name="q"
        placeholder="Buscar..."
        value="{{ query }}"
    />

    {% block filtros %}{% endblock %}

    <button type="submit">Pesquisar</button>
</form>

<style>
.search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.search-bar input,
.search-bar select {
    padding: 6px;
}
</style>
