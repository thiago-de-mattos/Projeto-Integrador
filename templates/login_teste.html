{% extends 'base_teste.html' %}

{% block extra_head %}
<style>
  .auth-wrapper {
    min-height: calc(100vh - 4rem);
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at right, #3b1d5f, #050b1e);
  }

  .auth-card {
    width: 380px;
    padding: 40px;
    background: rgba(10, 20, 40, 0.88);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(0, 0, 0, .5);
    color: #fff;
    font-family: 'Inter', Arial, sans-serif;
  }

  .logo {
    text-align: center;
    font-size: 38px;
    margin-bottom: 10px;
  }

  .auth-card h1 {
    text-align: center;
    margin: 0;
  }

  .auth-card p {
    text-align: center;
    color: #9bb;
    margin: 10px 0 30px;
  }

  .auth-card label {
    font-size: 14px;
    margin-top: 15px;
    display: block;
  }

  .auth-card input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: none;
    background: #0f1a30;
    color: #fff;
  }

  .auth-card button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #19e3ff, #4b7bff);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #000;
  }

  .auth-card button:hover {
    opacity: .9;
  }

  .auth-footer {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
  }

  .auth-footer a {
    color: #19e3ff;
    text-decoration: none;
  }

  .error {
    margin-top: 15px;
    background: rgba(255, 0, 0, .15);
    padding: 10px;
    border-radius: 8px;
    color: #ff9b9b;
    font-size: 14px;
    text-align: center;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo">🎮</div>

    <h1>Bem-vindo de volta</h1>
    <p>Acesse sua conta na Intranet ACJOGOS-RJ</p>

    <form method="post">
      {% csrf_token %}

      <label>E-mail</label>
      <input type="email" name="email" placeholder="seu@email.com" required>

      <label>Senha</label>
      <input type="password" name="password" placeholder="••••••••" required>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <button type="submit">Entrar →</button>
    </form>

    <div class="auth-footer">
      Ainda não tem conta?
      <a href="{% url 'cadastro_teste' %}">Associe-se</a>
    </div>
  </div>
</div>
{% endblock %}
