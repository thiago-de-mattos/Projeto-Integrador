{% extends 'base_logado.html' %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <div class="form-title">
            <h1>Editar Empresa</h1>
            <h2>{{ empresa.nome_fantasia }}</h2>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <div class="form-actions">
                <button class="btn-primary">Salvar</button>
                <a href="{% url 'listagem_empresas' %}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
