{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <div style="text-align: center;">
            <img src="https://ggjv4.s3.us-west-1.amazonaws.com/files/styles/sidebar_full/s3/jam_sites/2025/162364/site_poster/logo-vert-fullcolor.png" alt="Logomarca da AC Jogos" width="100" height="100">
        </div>        

        <div style="margin-top: 20px;">
            <h1 class="titulo">Login</h1>
        </div>
        
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <input type="text" placeholder="Digite seu username..." name="username" value="{{ request.POST.username }}">
            <input type="password" placeholder="Digite sua senha..." name="senha">
            <input type="submit" value="ENTRAR">
        </form>
        
        <div class="link">
            <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se aqui</a></p>
        </div>
    </div>
{% endblock %}
