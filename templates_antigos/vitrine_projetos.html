{% extends 'base.html' %} 

{% block content %}
<h1>Vitrine de Jogos / Projetos</h1>

<form method="get" class="search-bar">
    <input
        type="text"
        name="q"
        placeholder="Buscar por título ou descrição"
        value="{{ query }}"
    />

    <select name="genero">
        <option value="">Todos os gêneros</option>
        {% for g in generos %}
            <option value="{{ g }}" {% if g == genero_selecionado %}selected{% endif %}>
                {{ g }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Pesquisar</button>
</form>

<ul>
    {% for projeto in projetos %}
        <li>
            <strong>{{ projeto.titulo }}</strong><br>
            Gênero: {{ projeto.genero_principal }}<br>
            Status: {{ projeto.status }}
        </li>
    {% empty %}
        <li>Nenhum projeto encontrado.</li>
    {% endfor %}
</ul>
{% endblock %}
